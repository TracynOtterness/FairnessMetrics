[project]
name = "fairness-metrics-visualizer"
version = "0.1.0"
description = "Interactive visualization of algorithmic fairness metrics and the Impossibility Theorem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3.0.0", "numpy>=1.26.0", "scipy>=1.11.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
